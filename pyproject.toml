[build-system]
requires = ["setuptools>=77"]   # SPDX licence string
build-backend = "setuptools.build_meta"

[project]
name = "livecaptions"
version = "0.1.0"
description = "Live lecture captions with whisper.cpp or faster-whisper, built to run on battery"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6-Essentials>=6.7",
    "numpy>=1.26",
    "psutil>=5.9",
    "platformdirs>=4.0",
    "tomli-w>=1.0",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
faster-whisper = ["faster-whisper>=1.1"]
chinese = ["opencc>=1.1"]
audio-formats = ["soundfile>=0.12"]   # FLAC and Opus recordings
dev = ["pytest>=8"]

[project.scripts]
livecaptions = "livecaptions.main:main"

[tool.setuptools.packages.find]
include = ["livecaptions*"]

[tool.setuptools.package-data]
livecaptions = ["bin/*", "models/registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
