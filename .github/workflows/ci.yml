# Builds lc_native, runs the tests and packages the app on Windows and macOS (Apple Silicon).
# CI cannot test real capture, the GPU or power (PLAN.md §17.1): native builds here are CPU/Metal compile checks
# (on macOS this also compiles the Core Audio process tap), and the end-to-end tests transcribe whisper.cpp's sample
# WAV on the CPU with the tiny models of both backends. Audio capture is not tested here: the macOS runner is a VM
# whose system audio permission nobody can grant (the tap waits minutes for it), so it is tested on a real Mac.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            gpu: cpu
          - os: macos-latest   # arm64; a pinned macos-NN label stops working when GitHub retires that image
            gpu: metal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60   # a normal run takes 6-20 min; GitHub's default would wait 6 h on a hang
    env:
      PYTHONIOENCODING: utf-8   # the replay output has non-ASCII text
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python packages
        run: python -m pip install -e ".[dev,chinese,audio-formats,faster-whisper]"

      - name: Build lc_native (whisper.cpp fetched at the pinned commit)
        run: python scripts/build_native.py --gpu ${{ matrix.gpu }} --portable

      - name: Cache models
        uses: actions/cache@v6
        with:
          path: ci-models
          key: models-tiny-q5_1-fw-tiny

      - name: Download the tiny models
        shell: bash
        run: |
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download('ggerganov/whisper.cpp', 'ggml-tiny-q5_1.bin', local_dir='ci-models')"
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-tiny', local_dir='ci-models/fw-tiny', allow_patterns=['*.json', '*.bin', '*.txt'])"

      - name: Import the UI offscreen
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import livecaptions.ui.app, livecaptions.main; print('ui ok')"

      - name: Tests
        shell: bash
        env:
          LC_TEST_MODEL: ci-models/ggml-tiny-q5_1.bin
          LC_TEST_FW_MODEL: ci-models/fw-tiny
          LC_TEST_WAV: build/_deps/whisper-src/samples/jfk.wav
          LC_TEST_DEVICE: cpu
          LC_TEST_TEN_DOWNLOAD: '1'
        run: python -m pytest -v -rs

      - name: Replay the sample with each policy (prints latency and load)
        shell: bash
        run: |
          python -c "import os; print('logical cores:', os.cpu_count())"   # CPU threads are capped at this
          for p in local_agreement vad_chunk sliding_window; do
            python tools/replay.py build/_deps/whisper-src/samples/jfk.wav --model ci-models/ggml-tiny-q5_1.bin --vad energy --cpu --speed 0 --config none.toml --set stream.policy=$p
          done

      # The packages: Windows with the CPU-only lc_native built above (a Vulkan build needs the Vulkan SDK; build that
      # one locally), macOS with Metal. Unsigned: macOS asks to confirm opening it (README).
      - name: Package the app (PyInstaller)
        shell: bash
        run: |
          python -m pip install -e ".[package]"
          python scripts/build_app.py

      # --timeout: a hanging check writes every thread's stack into its report and exits after 5 min.
      - name: Check the packaged app (windows offscreen, one transcription per backend)
        shell: bash
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = macOS ]; then app=dist/LiveCaptions.app/Contents/MacOS/LiveCaptions; else app=dist/LiveCaptions/LiveCaptions.exe; fi
          wav=build/_deps/whisper-src/samples/jfk.wav
          status=0
          "$app" --self-check --ui --cpu --model ci-models/ggml-tiny-q5_1.bin --wav $wav --timeout 300 --report check-whispercpp.txt || status=1
          "$app" --self-check --cpu --model ci-models/fw-tiny --wav $wav --timeout 300 --report check-fasterwhisper.txt || status=1
          cat check-whispercpp.txt check-fasterwhisper.txt
          exit $status

      - name: Show the self-check reports (after a failure or a time-out)
        if: failure()
        shell: bash
        run: cat check-*.txt || true

      - uses: actions/upload-artifact@v7
        with:
          name: LiveCaptions-${{ matrix.os }}
          path: dist/*.zip
